name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

jobs:
  daemon-tests:
    runs-on: ubuntu-22.04
    env:
      # The daemon writes its DB to the XDG data dir, so keep test runs off the real one.
      XDG_DATA_HOME: ${{ runner.temp }}/xdg
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: services/daemon
      - name: Run daemon tests
        working-directory: services/daemon
        run: cargo test -- --test-threads=1

  app-tests:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.6
          cache: true
      - name: Run Flutter tests
        working-directory: apps/desktop
        run: |
          flutter pub get
          flutter test
